controller_manager:
  ros__parameters:
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

    cartesian_motion_controller:
      type: cartesian_motion_controller/CartesianMotionController

    motion_control_handle:
      type: cartesian_controller_handles/MotionControlHandle

    forward_command_controller_velocity:
      type: forward_command_controller/ForwardCommandController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true

joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 125.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: true
    open_loop_control: true
    constraints:
      stopped_velocity_tolerance: 0.1
      goal_time: 0.0
      shoulder_pan_joint: { trajectory: 10.1, goal: 0.1 }
      shoulder_lift_joint: { trajectory: 10.1, goal: 0.1 }
      elbow_joint: { trajectory: 10.1, goal: 0.1 }
      wrist_1_joint: { trajectory: 10.1, goal: 0.1 }
      wrist_2_joint: { trajectory: 10.1, goal: 0.1 }
      wrist_3_joint: { trajectory: 10.1, goal: 0.1 }
    gains:
      shoulder_pan_joint: { p: 10.0, i: 1.0, d: 0.1 }
      shoulder_lift_joint: { p: 10.0, i: 1.0, d: 0.1 }
      elbow_joint: { p: 10.0, i: 1.0, d: 0.1 }
      wrist_1_joint: { p: 10.0, i: 1.0, d: 0.1 }
      wrist_2_joint: { p: 10.0, i: 1.0, d: 0.1 }
      wrist_3_joint: { p: 10.0, i: 1.0, d: 0.1 }

forward_command_controller_velocity:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: velocity

forward_velocity_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    # interface_name: velocity

    # update_rate: 125

forward_position_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

cartesian_motion_controller:
  ros__parameters:
    end_effector_link: "tool0"
    robot_base_link: "base_link"
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

    command_interfaces:
      - position
      # - velocity

    solver:
      error_scale: 50.0
      iterations: 30
      publish_state_feedback: True

    pd_gains:
      trans_x: { p: 1.0 }
      trans_y: { p: 1.0 }
      trans_z: { p: 1.0 }
      rot_x: { p: 1.0 }
      rot_y: { p: 1.0 }
      rot_z: { p: 1.0 }

motion_control_handle:
  ros__parameters:
    end_effector_link: "tool0"
    robot_base_link: "base_link"
    ft_sensor_ref_link: "tool0"
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
