joystick_teleop:
  ros__parameters:
    publish_rate_hz: 50.0
    joy_timeout_sec: 0.2
    twist_frame_id: base_link

    input_processing:
      deadzone: 0.05
      nonlinear_exponent: 1.5
      lowpass_alpha: 0.8

    # Logitech F710 axis mapping (verified from /joy topic)
    # Triggers rest at 1.0, pressed at -1.0
    axis_mapping:
      left_stick_x:
        axis: 0
        component: lx
        scale: 1.0
        trigger_mode: false
      left_stick_y:
        axis: 1
        component: ly
        scale: 1.0
        trigger_mode: false
      lt_trigger:
        axis: 2
        component: ay
        scale: 1.0
        trigger_mode: true
      right_stick_x:
        axis: 3
        component: az
        scale: -1.0
        trigger_mode: false
      right_stick_y:
        axis: 4
        component: lz
        scale: 1.0
        trigger_mode: false
      rt_trigger:
        axis: 5
        component: ax
        scale: 1.0
        trigger_mode: true

    button_mapping:
      deadman_switch: 4    # LB
      estop: 6             # Back
      gripper_open: 0      # A       (requires LB held)
      gripper_close: 1     # B       (requires LB held)
      speed_down: 3        # Y       (TODO: not implemented)
      speed_up: 2          # X       (TODO: not implemented)
      go_home: 7           # Start   (TODO: not implemented)

    dpad_mapping:
      horizontal_axis: 6
      left_value: 1.0
      right_value: -1.0
      activation_threshold: 0.5

    deadman_switch:
      enabled: true

    gripper:
      joint_name: onrobot_2fg14_finger_width
      limit_open: 0.105
      limit_close: 0.055
      trajectory_duration: 0.5
      direct_command_topic: OnRobotRGOutput
      direct_status_topic: OnRobotRGInput
      direct_open_width_mm: 100.0
      direct_close_width_mm: 0.0
      direct_open_force_n: 10.0
      direct_close_force_n: 40.0
      direct_step_mm: 1.0
      direct_repeat_period_sec: 0.05

    safety:
      startup_delay_sec: 1.0
