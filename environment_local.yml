# Reproducible local environment for simulation, dataset tools, teleoperation,
# cameras, and CPU policy execution. GPU training uses a separate Docker image.
name: microwave_dp

channels:
  - conda-forge

dependencies:
  - python=3.10.12
  - pip
  - setuptools
  - wheel
  - cmake
  - ninja
  - pkg-config
  - ffmpeg=4.4
  - pip:
      # Prefer CPU PyTorch wheels. The local robot PC does not require CUDA.
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.11.0
      - torchvision==0.26.0

      # Numerical, image, and dataset stack.
      - numpy==2.2.6
      - opencv-python==4.13.0.92
      - pillow==12.2.0
      - h5py==3.16.0
      - zarr==2.18.3
      - numcodecs==0.13.1
      - imagecodecs==2025.3.30
      - imageio==2.37.3
      - imageio-ffmpeg==0.6.0
      - pandas==2.3.3
      - matplotlib==3.10.9

      # Diffusion Policy and configuration stack.
      - diffusers==0.11.1
      - huggingface-hub==0.23.0
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - einops==0.8.2
      - dill==0.4.1
      - robomimic==0.2.0
      - tensorboard==2.20.0
      - tensorboardX==2.6.5
      - wandb==0.25.1

      # Simulation, kinematics, cameras, robot, and gripper.
      - mujoco==3.6.0
      - glfw==2.10.0
      - PyOpenGL==3.1.10
      - pin==4.0.0
      - pyrealsense2==2.58.1.10581
      - pymodbus==3.13.1
      - urx==0.11.0
      - math3d==4.0.0

      # General utilities and local checks.
      - PyYAML==6.0.3
      - requests==2.32.5
      - psutil==7.2.2
      - tqdm==4.67.3
      - GitPython==3.1.46
      - pytest==9.0.2
